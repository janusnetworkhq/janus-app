name: janus

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-janus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-janus}
      POSTGRES_DB: ${POSTGRES_DB:-janus}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - janus_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-janus} -d ${POSTGRES_DB:-janus}"]
      interval: 5s
      timeout: 5s
      retries: 12
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - idle_in_transaction_session_timeout=30000
      - -c
      - log_min_duration_statement=500
      - -c
      - password_encryption=scram-sha-256

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass janus --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - janus_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "janus", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  localstack:
    image: localstack/localstack:3.8
    restart: unless-stopped
    environment:
      SERVICES: s3,sqs
      DEFAULT_REGION: ap-south-1
      AWS_DEFAULT_REGION: ap-south-1
      PERSISTENCE: "1"
    ports:
      - "4566:4566"
    volumes:
      - janus_localstack_data:/var/lib/localstack
      - ./infra/local/localstack:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 8s
      timeout: 5s
      retries: 15

volumes:
  janus_pg_data:
  janus_redis_data:
  janus_localstack_data:
